name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
  workflow_run:
    workflows: ["6-Hour AI Data Aggregation"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: ai-hot-pages-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Refresh meta timestamp (Asia/Shanghai)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          meta_path = Path('data/meta.json')
          meta = {}
          if meta_path.exists():
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['last_update'] = datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y-%m-%d %H:%M:%S')
          meta.setdefault('version', '3.0')
          results = meta.get('results') or {}
          results['网站部署'] = f"✅ GitHub Pages 发布 {meta['last_update']}"
          meta['results'] = results
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Sync data to Hugo
        # site/data 不入库（见 .gitignore），构建前从 data/ 同步；目录可能不存在，先创建
        run: |
          mkdir -p site/data
          cp -r data/* site/data/

      - name: Verify no secrets before build
        run: python scripts/sanitize_secrets.py --check

      - name: Build
        working-directory: site
        run: hugo --minify

      # 页面体积门禁：超标直接失败，宁可暂停发布也不上线一个过大的页面
      - name: Check page weight
        run: python scripts/check_page_weight.py

      - name: Create CNAME
        run: echo "aihot.bt199.com" > site/public/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/public
