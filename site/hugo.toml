baseURL = "https://aihot.bt199.com/"
locale = "zh-CN"
title = "AI热榜 - 每6小时更新 | AI工具大全·AI导航·AI工具推荐"
defaultContentLanguage = "zh"
hasCJKLanguage = true

# 首页/列表页都是客户端分页（见 layouts/_default/list.html），不依赖 Hugo 分页器；
# 仍按新语法声明，避免旧顶层键 paginate 在后续 Hugo 版本报错。
[pagination]
  pagerSize = 20

# 首页 RSS 默认会遍历全部子页面，不加限制时 index.xml 会涨到 3MB
[services.rss]
  limit = 20

[params]
  description = "AI热榜 - 中文AI世界实时热榜。持续收录 AI 工具、AI 模型、AI Agent 与 AI 新闻，每6小时自动更新。AI工具排名、免费AI工具推荐、国产大模型对比、AI新闻一网打尽。"
  keywords = "AI热榜, AI工具, AI导航, AI工具大全, AI工具推荐, 免费AI工具, AI写作, AI绘画, AI编程, 大模型, 国产大模型, AI Agent"
  author = "AI热榜"

[params.homepage]
  showSpotlight = true
  showTrending = true
  showHotNews = true

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[[menu.main]]
  name = "🔥 热榜"
  url = "/"
  weight = 1

[[menu.main]]
  name = "🧠 模型"
  url = "/models/"
  weight = 2

[[menu.main]]
  name = "🛠️ 工具"
  url = "/tools/"
  weight = 3

[[menu.main]]
  name = "🤖 Agent"
  url = "/agents/"
  weight = 4

[[menu.main]]
  name = "📰 新闻"
  url = "/news/"
  weight = 5

[[menu.main]]
  name = "🏢 提供商"
  url = "/providers/"
  weight = 6

[[menu.main]]
  name = "🔍 搜索"
  url = "/search/"
  weight = 7

[[menu.main]]
  name = "⚔️ 对比"
  url = "/compare/"
  weight = 8
