{{ define "main" }}
<div style="margin-bottom:20px">
    <a href="{{ relURL "/tools/" }}" style="color:var(--text2);font-size:13px">← 返回工具列表</a>
</div>

<div class="card" style="text-align:center;padding:40px">
    <div style="font-size:48px;margin-bottom:12px">🔁</div>
    <div style="color:var(--text2)">工具详情已升级为静态页面，正在为你跳转...</div>
    <div style="margin-top:12px;font-size:13px;color:var(--text3)">如果没有自动跳转，请稍候或返回工具列表。</div>
</div>

<script>
// 这里只为按 id 查出工具并跳转，没必要把整个工具库内嵌进页面
const params = new URLSearchParams(location.search);
const id = params.get('id');
if (id) {
    fetch('{{ "tools-full.json" | relURL }}')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(tools => {
            const tool = (tools || []).find(t =>
                t.id === id || (t.name || '').toLowerCase().replace(/[^a-z0-9]/g, '-') === id);
            if (tool && tool.id) {
                window.location.replace('{{ relURL "/tools/" }}' + encodeURIComponent(tool.id) + '/');
            }
        })
        .catch(err => console.warn('工具数据加载失败:', err));
}
</script>
{{ end }}
